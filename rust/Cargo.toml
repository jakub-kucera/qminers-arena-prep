[package]
name = "arena_rs"
version = "0.1.0"
edition = "2021"
description = "A Rust port of arena/engine.py and one bot, for benchmarking against the Python engine (see README.md)"
publish = false

[dependencies]

[[bin]]
name = "arena-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
