[project]
name = "qminers-arena"
version = "0.1.0"
description = "Backtester, submission validator and bot template for the Qminers Algo Trade Arena."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
analysis = [
    "jupyterlab>=4.6.4",
]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
